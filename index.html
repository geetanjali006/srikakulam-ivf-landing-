<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medcy IVF & Hospitals | Free Fertility Camp Vizag - మెడ్సీ IVF & హాస్పిటల్స్</title>
    <meta name="description" content="MEDCY IVF & Hospitals Visakhapatnam - Free Fertility & Medical Camp in Vizag. 20+ Years Experience, 5000+ Happy Families, 82% Clinical Success Rate. Book Free Appointment Today." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('load', function() {
        // Track Page Visit
        fetch('https://adinsights.medcytech.com/api/track-click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ elementClicked: 'Page Visit: Consultation Medcy IVF' }),
        }).catch(err => console.error(err));
    
        // Track Link Clicks
        document.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', function() {
            const linkText = this.innerText.trim() || 'Icon/Image Link';
            fetch('https://adinsights.medcytech.com/api/track-click', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ elementClicked: `[Consultation Medcy IVF] Clicked: ${linkText}` }),
            }).catch(err => console.error(err));
          });
        });
      });
    </script>
  </head>
  <body class="bg-[#FAF6FA] text-[#2A102D] antialiased selection:bg-[#652D6C] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
